<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Supreme IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #e2e8f0; line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .thank-card { position: relative; z-index: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 24px; padding: 48px; text-align: center; max-width: 500px; box-shadow: 0 0 50px rgba(168, 85, 247, 0.25); backdrop-filter: blur(12px); }
        .thank-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899); border-radius: 24px 24px 0 0; }
        .icon { font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(56, 189, 248, 0.8); }
        h1 { font-family: 'Press Start 2P', cursive; font-size: 20px; color: #fff; margin-bottom: 16px; background: linear-gradient(90deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 28px; }
        .btn-back { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #38bdf8, #818cf8, #a855f7); border-radius: 12px; color: #fff; font-family: 'Press Start 2P', cursive; font-size: 11px; text-decoration: none; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); transition: all 0.2s; }
        .btn-back:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="thank-card">
        <div class="icon">🚀</div>
        <h1>REQUEST RECEIVED!</h1>
        <p>Thank you for reaching out to Supreme IT. Our enterprise team has received your details via Salesforce and will get in touch shortly.</p>
        <a href="index.html" class="btn-back">< RETURN TO HOME</a>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        const particles = [];
        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1, color: Math.random() > 0.5 ? '#38bdf8' : '#a855f7',
                vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, alpha: Math.random() * 0.5 + 0.2
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.shadowBlur = 10; ctx.shadowColor = p.color; ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
