<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Supreme IT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Supreme IT</h2>
    <p>Get in touch with our enterprise IT specialists</p>

    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DQy00000vnb7F" method="POST">

        <!-- שדות מערכת נסתרים -->
        <input type="hidden" name="oid" value="00DQy00000vnb7F">
        <input type="hidden" name="retURL" value="https://www.google.com">
        <input type="hidden" id="lead_source" name="lead_source" value="Web" />
        
        <!-- שיוך אוטומטי לקמפיין (החליפי את YOUR_CAMPAIGN_ID ב-ID האמיתי מסיילספורס) -->
        <input type="hidden" name="Campaign_ID" value="YOUR_CAMPAIGN_ID">
        <input type="hidden" name="member_status" value="Responded">

        <!-- שדות הטופס לפי דרישות המערכת -->
        <label for="first_name">First Name</label>
        <input id="first_name" name="first_name" type="text" required />

        <label for="last_name">Last Name</label>
        <input id="last_name" name="last_name" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="company">Company</label>
        <input id="company" name="company" type="text" required />

        <label for="mobile">Mobile</label>
        <input id="mobile" name="mobile" type="text" />

        <label for="title">Title</label>
        <input id="title" name="title" type="text" />

        <label for="country_code">Country</label>
        <select id="country_code" name="country_code">
            <option value="">--Select Country--</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
            <option value="DE">Germany</option>
            <option value="IL">Israel</option>
            <option value="JP">Japan</option>
            <option value="BR">Brazil</option>
        </select>

        <label for="industry">Industry</label>
        <select id="industry" name="industry">
            <option value="">--Select Industry--</option>
            <option value="Technology">Technology</option>
            <option value="Finance">Finance</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Other">Other</option>
        </select>

        <label for="00NQy000027WHez">Number of Employees</label>
        <select id="00NQy000027WHez" name="00NQy000027WHez">
            <option value="">--Select Size--</option>
            <option value="0-249">0-249</option>
            <option value="250-499">250-499</option>
            <option value="500-999">500-999</option>
            <option value="1,000-4,999">1,000-4,999</option>
            <option value="5,000-9,999">5,000-9,999</option>
            <option value="10,000+">10,000+</option>
        </select>

        <input type="submit" value="Submit Request">
    </form>
</div>

</body>
</html>
